<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 Django 網站</title>
    <style>
        /* 把從 GrapesJS 複製的 CSS 貼在這裡 */
        * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "PMingLiU", "新細明體", "Noto Serif TC", serif;
  background-color: #ffffff;
  color: #000000;
  padding: 12px 0;
}

.container {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  text-align: center;
}

/* 標題列樣式 */
.main-title {
  font-size: 24px;
  font-weight: normal;
  padding: 10px 16px;
  border-top: 3px double #999999;
  border-bottom: 3px double #999999;
}

/* 區塊間距（對應圖片中的空白間隔） */
.link-group {
  list-style: none;
  margin-bottom: 18px;
}

.link-group:last-child {
  margin-bottom: 0;
}

/* 每個連結項目的上下雙線框 */
.link-group li {
  padding: 10px 16px;
  border-bottom: 3px double #999999;
}

/* 每個新區塊的第一列加上頂部雙線 */
.link-group li:first-child {
  border-top: 3px double #999999;
}

/* 經典藍色超連結樣式 */
.link-group a {
  font-size: 24px;
  color: #0000ee;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.link-group a:visited {
  color: #551a8b;
}

.link-group a:hover {
  background-color: #f3f6ff;
}

    </style>
</head>
<body>
    <!-- 把從 GrapesJS 複製的 HTML 貼在這裡 -->
    
  <div class="container">
    <h1 class="main-title">地下兵工廠 測試場 集中地</h1>

    <!-- 第一區塊：圖檔與 PDF 工具 -->
    <ul class="link-group">
      <li><a href="#">圖檔單檔上傳</a></li>
      <li><a href="#">PDF 比例縮放與壓縮對比工具</a></li>
      <li><a href="#">PDF 轉 Word 轉換器</a></li>
      <li><a href="#">把每一頁 PDF變成清楚的 JPG</a></li>
    </ul>

    <!-- 第二區塊：Office 與圖片工具 -->
    <ul class="link-group">
      <li><a href="#">PPT / Excel 圖片瘦身工具</a></li>
      <li><a href="#">Excel 圖片轉換器 儲存格中-&gt;儲存格上</a></li>
      <li><a href="#">圖片比例縮放50%與預覽對比工具</a></li>
    </ul>

    <!-- 第三區塊：ERP 與單據列印 -->
    <ul class="link-group">
      <li><a href="#">訂單採購全流程統整追蹤</a></li>
      <li><a href="#">ERP 應收與逾期帳款整合查詢</a></li>
      <li><a href="#">Invoice 列印</a></li>
      <li><a href="#">PACKING List 列印</a></li>
    </ul>
  </div>


</body>
</html>
